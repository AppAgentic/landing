<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App Agentic</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230a0a0a'/><circle cx='16' cy='16' r='6' fill='none' stroke='%234fffff' stroke-width='1.5' opacity='0.9'/><circle cx='16' cy='16' r='2' fill='%234fffff'/></svg>">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #0a0a0a;
      --surface: #111111;
      --border: #1a1a1a;
      --text: #e0e0e0;
      --text-dim: #555555;
      --accent: #4fffff;
      --accent-dim: rgba(79, 255, 255, 0.08);
      --glow: rgba(79, 255, 255, 0.15);
    }

    html {
      font-size: 16px;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient background glow */
    .ambient {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .ambient-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0;
      animation: drift 20s ease-in-out infinite;
    }

    .ambient-orb:nth-child(1) {
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(79, 255, 255, 0.07), transparent 70%);
      top: -200px;
      left: -100px;
      animation-delay: 0s;
    }

    .ambient-orb:nth-child(2) {
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(79, 200, 255, 0.05), transparent 70%);
      bottom: -150px;
      right: -100px;
      animation-delay: -7s;
    }

    .ambient-orb:nth-child(3) {
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(120, 80, 255, 0.04), transparent 70%);
      top: 40%;
      left: 50%;
      animation-delay: -14s;
    }

    @keyframes drift {
      0%, 100% {
        opacity: 0.4;
        transform: translate(0, 0) scale(1);
      }
      25% {
        opacity: 0.7;
        transform: translate(30px, -20px) scale(1.05);
      }
      50% {
        opacity: 0.5;
        transform: translate(-20px, 30px) scale(0.95);
      }
      75% {
        opacity: 0.8;
        transform: translate(10px, 10px) scale(1.02);
      }
    }

    /* Particle field */
    .particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .particle {
      position: absolute;
      width: 2px;
      height: 2px;
      background: var(--accent);
      border-radius: 50%;
      opacity: 0;
      animation: float linear infinite;
    }

    @keyframes float {
      0% {
        opacity: 0;
        transform: translateY(0) translateX(0);
      }
      10% {
        opacity: 0.3;
      }
      90% {
        opacity: 0.3;
      }
      100% {
        opacity: 0;
        transform: translateY(-100vh) translateX(20px);
      }
    }

    /* Content */
    .content {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 2rem;
      max-width: 680px;
      width: 100%;
    }

    /* Brand */
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 4rem;
      opacity: 0;
      animation: fadeIn 1.5s ease 0.3s forwards;
    }

    .brand-mark {
      width: 28px;
      height: 28px;
      position: relative;
    }

    .brand-mark svg {
      width: 100%;
      height: 100%;
    }

    .brand-name {
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-dim);
    }

    /* Hero */
    .hero-text {
      font-size: clamp(2.2rem, 6vw, 3.8rem);
      font-weight: 300;
      line-height: 1.15;
      letter-spacing: -0.02em;
      margin-bottom: 1.5rem;
      opacity: 0;
      animation: fadeIn 1.5s ease 0.6s forwards;
      position: relative;
    }

    .hero-text .shimmer {
      background: linear-gradient(
        120deg,
        var(--text) 0%,
        var(--text) 40%,
        var(--accent) 50%,
        var(--text) 60%,
        var(--text) 100%
      );
      background-size: 200% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shimmer 6s ease-in-out infinite;
    }

    @keyframes shimmer {
      0%, 100% {
        background-position: 200% center;
      }
      50% {
        background-position: -200% center;
      }
    }

    .hero-glow {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80%;
      height: 120%;
      background: radial-gradient(ellipse, var(--glow), transparent 70%);
      pointer-events: none;
      animation: pulse 4s ease-in-out infinite;
      z-index: -1;
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 0.3;
        transform: translate(-50%, -50%) scale(1);
      }
      50% {
        opacity: 0.6;
        transform: translate(-50%, -50%) scale(1.1);
      }
    }

    /* Tagline */
    .tagline {
      font-size: 1.05rem;
      font-weight: 400;
      color: var(--text-dim);
      margin-bottom: 3.5rem;
      letter-spacing: 0.01em;
      opacity: 0;
      animation: fadeIn 1.5s ease 0.9s forwards;
    }

    /* Email form */
    .signup {
      display: flex;
      align-items: center;
      max-width: 440px;
      margin: 0 auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 4px;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
      opacity: 0;
      animation: fadeIn 1.5s ease 1.2s forwards;
    }

    .signup:focus-within {
      border-color: rgba(79, 255, 255, 0.2);
      box-shadow: 0 0 30px rgba(79, 255, 255, 0.05);
    }

    .signup input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      padding: 14px 16px;
      font-family: inherit;
      font-size: 0.9rem;
      color: var(--text);
      min-width: 0;
    }

    .signup input::placeholder {
      color: #3a3a3a;
    }

    .signup button {
      background: var(--accent);
      color: var(--bg);
      border: none;
      padding: 12px 24px;
      border-radius: 9px;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
      letter-spacing: 0.01em;
    }

    .signup button:hover {
      background: #6cffff;
      box-shadow: 0 0 20px rgba(79, 255, 255, 0.25);
    }

    .signup button:active {
      transform: scale(0.97);
    }

    /* Success state */
    .signup.success {
      pointer-events: none;
    }

    .signup.success input {
      display: none;
    }

    .signup.success button {
      width: 100%;
      background: transparent;
      color: var(--accent);
      cursor: default;
      box-shadow: none;
      font-weight: 400;
      letter-spacing: 0.05em;
    }

    /* Subtle divider line */
    .divider {
      width: 40px;
      height: 1px;
      background: var(--border);
      margin: 3rem auto 0;
      opacity: 0;
      animation: fadeIn 1.5s ease 1.5s forwards;
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
      }
    }

    /* Mobile adjustments */
    @media (max-width: 480px) {
      .content {
        padding: 1.5rem;
      }

      .brand {
        margin-bottom: 3rem;
      }

      .tagline {
        font-size: 0.95rem;
        margin-bottom: 2.5rem;
      }

      .signup {
        flex-direction: column;
        gap: 0;
        padding: 6px;
      }

      .signup input {
        width: 100%;
        text-align: center;
        padding: 12px 16px;
      }

      .signup button {
        width: 100%;
        padding: 14px 24px;
      }
    }
  </style>
</head>
<body>

  <!-- Ambient background -->
  <div class="ambient">
    <div class="ambient-orb"></div>
    <div class="ambient-orb"></div>
    <div class="ambient-orb"></div>
  </div>

  <!-- Particle field -->
  <div class="particles" id="particles"></div>

  <!-- Main content -->
  <main class="content">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="14" cy="14" r="6" stroke="#4fffff" stroke-width="1.2" opacity="0.6"/>
          <circle cx="14" cy="14" r="11" stroke="#4fffff" stroke-width="0.5" opacity="0.2"/>
          <circle cx="14" cy="14" r="2" fill="#4fffff" opacity="0.9"/>
        </svg>
      </div>
      <span class="brand-name">App Agentic</span>
    </div>

    <h1 class="hero-text">
      <div class="hero-glow"></div>
      <span class="shimmer">The agentic era is here</span>
    </h1>

    <p class="tagline">AI agents for the next generation of apps</p>

    <form class="signup" id="signup" onsubmit="return false;">
      <input type="email" placeholder="you@example.com" id="email" autocomplete="email" required>
      <button type="submit" id="cta">Get early access</button>
    </form>

    <div class="divider"></div>
  </main>

  <script>
    // Particles
    (function() {
      const container = document.getElementById('particles');
      const count = 30;
      for (let i = 0; i < count; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.style.left = Math.random() * 100 + '%';
        p.style.top = Math.random() * 100 + '%';
        p.style.animationDuration = (15 + Math.random() * 25) + 's';
        p.style.animationDelay = (Math.random() * 20) + 's';
        p.style.width = (1 + Math.random() * 1.5) + 'px';
        p.style.height = p.style.width;
        container.appendChild(p);
      }
    })();

    // Form interaction
    (function() {
      const form = document.getElementById('signup');
      const input = document.getElementById('email');
      const btn = document.getElementById('cta');

      btn.addEventListener('click', function() {
        if (input.value && input.validity.valid) {
          form.classList.add('success');
          btn.textContent = "You\u2019re on the list";
        }
      });
    })();
  </script>
</body>
</html>
